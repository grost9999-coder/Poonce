export async function handleNewebPayCallback(req, res) {
  const { TradeInfo, TradeSha, Status, Message } = req.body; // 或 req.query 依藍新版本
  const HASHKEY = process.env.NEWEBPAY_HASHKEY;
  const HASHIV = process.env.NEWEBPAY_HASHIV;

  // 1. 驗證 SHA
  const expectedSha = crypto.createHash('sha256')
    .update(\`HashKey=\${HASHKEY}&\${TradeInfo}&HashIV=\${HASHIV}\`)
    .digest('hex').toUpperCase();

  if (expectedSha !== TradeSha) {
    console.error('CheckValue mismatch', { expectedSha, TradeSha });
    return res.status(400).send('0|CheckValue Error');
  }

  // 2. 解密
  const decrypted = aesDecrypt(TradeInfo, HASHKEY, HASHIV);
  const data = parseQuery(decrypted);
  // data 包含：MerchantOrderNo, TradeNo, Amt, PaymentType, PeriodType, PeriodAmt, Email, etc.

  const { MerchantOrderNo, TradeNo, Email, PeriodAmt, PeriodType, Status: tradeStatus } = data;

  if (tradeStatus !== 'SUCCESS' && data.Status !== 'SUCCESS') {
    console.log('Payment not success', data);

    ? new Date(Date.now() + 365*24*60*60*1000).toISOString().slice(0,10)
    : new Date(Date.now() + 30*24*60*60*1000).toISOString().slice(0,10);

  await supabase.from('users').upsert({
    email: Email,
    is_pro: true,
    plan,
    provider: 'newebpay',
    expiry,
    trade_no: TradeNo,
    updated_at: new Date().toISOString()
  }, { onConflict: 'email' });

  await supabase.from('newebpay_orders').update({
    status: 'success',
    trade_no: TradeNo,
    raw: data
  }).eq('merchant_order_no', MerchantOrderNo);

  // 4. (選配) 發送 Email 收據 / 發票
  // await sendReceiptEmail(Email, plan);

  // 5. 回覆藍新
  res.send('1|OK');
}
